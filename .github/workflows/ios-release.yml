name: iOS Release (TestFlight)

# 出真机包并上传 TestFlight。
# 手动触发（workflow_dispatch），不随 push 自动跑——上传属于对外发布动作，必须人点头。
#
# 前置 GitHub Secrets（Settings → Secrets and variables → Actions）：
#   DEV_TEAM_ID          10 位 Team ID（developer.apple.com → Membership details）
#   ASC_KEY_ID           App Store Connect API Key 的 Key ID（10 位）
#   ASC_ISSUER_ID        Issuer ID（UUID 格式）
#   ASC_KEY_P8_BASE64    AuthKey_XXXX.p8 的 base64 单行（密钥只能下载一次）
#
# 本地把 .p8 转 base64（Git Bash）：
#   base64 -w0 AuthKey_XXXXXXXXXX.p8
# PowerShell：
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("C:\path\AuthKey_XXXXXXXXXX.p8"))

on:
  # push 到 main 自动跑"只出包不上传"（调试循环零人工）；上传 TestFlight 仍必须人工触发勾选
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "真正上传到 TestFlight（不勾=只验证能出包）"
        type: boolean
        default: false

jobs:
  release:
    # macos-26 = Xcode 26 / iOS 26 SDK（苹果2026起强制26 SDK上传；macos-15的Xcode16会被拒）
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen (direct binary, skip brew)
        run: |
          set -x
          curl -fsSL -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -q xcodegen.zip
          ./xcodegen/bin/xcodegen --version

      - name: Generate Xcode project
        run: ./xcodegen/bin/xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "key written: $(wc -c < "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8") bytes"

      - name: Archive (automatic signing via API key)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          DEV_TEAM_ID: ${{ secrets.DEV_TEAM_ID }}
        run: |
          set -o pipefail
          # archive 阶段不签名（CI 经典分法）：签名全部移到 export 步（ExportOptions method=app-store-connect 向云端要证书）
          # 此法绕开 xcodegen 工程签名设置与命令行参数的冲突（automatically signed for development vs Apple Distribution）
          xcodebuild archive \
            -project NotaryTrack.xcodeproj \
            -scheme NotaryTrack \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NotaryTrack.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="$DEV_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            2>&1 | tail -50

      - name: Export IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          DEV_TEAM_ID: ${{ secrets.DEV_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/NotaryTrack.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$DEV_TEAM_ID" \
            2>&1 | tail -30
          ls -lh "$RUNNER_TEMP/ipa"

      - name: Upload IPA as artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: NotaryTrack-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        if: ${{ inputs.upload_testflight }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          # altool 按约定目录找 AuthKey_<KeyID>.p8（./private_keys 等），不接受任意路径——写进约定目录
          mkdir -p ./private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "./private_keys/AuthKey_${ASC_KEY_ID}.p8"
          IPA=$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)
          echo "uploading $IPA"
          xcrun altool --upload-app --file "$IPA" --type ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            --verbose

      - name: Cleanup key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
          rm -rf ./private_keys

